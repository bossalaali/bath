<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="بث">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap">
<title>بث</title>
<style>
/* Streaming-service shell: black stage, red signal accent, hero billboard + horizontal rows */
:root{
  --bg:#000000; --bg2:#141414; --card:#1f1f1f; --card2:#2b2b2b;
  --fg:#ffffff; --fg2:#b3b3b3; --fg3:#808080; --sep:rgba(255,255,255,.12);
  --red:#e50914; --red2:#b20710; --white:#ffffff;
  --font:"Cairo",-apple-system,BlinkMacSystemFont,"SF Arabic","Geeza Pro",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--white);outline-offset:2px}
svg{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto}

/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:env(safe-area-inset-top,0px);transition:background .25s}
.topbar.solid{background:rgba(0,0,0,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.topbar.fade{background:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,0))}
.tb-row{display:flex;align-items:center;gap:10px;height:54px}
.brand{font-weight:900;font-size:32px;color:var(--red);letter-spacing:-.5px;line-height:1;text-shadow:0 2px 12px rgba(229,9,20,.35)}
.tb-title{font-weight:800;font-size:22px}
.tb-sp{flex:1}
.tb-btn{width:40px;height:40px;display:grid;place-items:center;color:#fff}
.tb-btn svg{width:24px;height:24px}
.chips{display:flex;gap:8px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.on{background:#fff;color:#000;border-color:#fff}
.under-bar{height:calc(env(safe-area-inset-top,0px) + 108px)}
.under-bar.short{height:calc(env(safe-area-inset-top,0px) + 62px)}

/* hero */
.hero{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:4/5;max-height:560px;width:100%;margin:6px auto 0;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 20px 50px rgba(0,0,0,.6);background:#111}
.hero .bgart{position:absolute;inset:-10%;filter:blur(38px) saturate(1.5);opacity:.85;transform:scale(1.1)}
.hero .bgimg{position:absolute;inset:-20%;width:140%;height:140%;object-fit:cover;filter:blur(50px) saturate(1.8);opacity:.55}
.hero .shade{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,0) 30%,rgba(0,0,0,.55) 62%,rgba(0,0,0,.95))}
.hero .center{position:absolute;top:12%;left:0;right:0;display:flex;justify-content:center}
.hero .center .logo{--s:150px;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.hero .info{position:absolute;bottom:0;left:0;right:0;padding:18px 16px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.hero h2{margin:0;font-size:30px;font-weight:900;line-height:1.15;text-wrap:balance;text-shadow:0 2px 16px rgba(0,0,0,.6)}
.tags{display:flex;align-items:center;gap:8px;font-size:13px;color:#e5e5e5;flex-wrap:wrap;justify-content:center}
.tags .dot{width:4px;height:4px;border-radius:50%;background:#888}
.livepill{display:inline-flex;align-items:center;gap:5px;background:var(--red);color:#fff;font-size:11px;font-weight:800;padding:1px 8px;border-radius:4px}
.livepill i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.hbtns{display:flex;gap:10px;width:100%;margin-top:6px}
.btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:6px;padding:9px 12px;font-weight:800;font-size:16px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn svg{width:22px;height:22px}
.btn.w{background:#fff;color:#000}
.btn.g{background:rgba(109,109,110,.55);color:#fff;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn.r{background:var(--red);color:#fff}

/* rows */
.rows{display:flex;flex-direction:column;gap:26px;margin-top:26px}
.rowh{display:flex;align-items:center;gap:6px;margin-bottom:8px;cursor:pointer;min-width:0}
.rowh h3{margin:0;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowh .more{font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:2px;flex:none;margin-inline-start:auto}
.rowh .more svg{width:14px;height:14px}
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}
.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}

/* tile = landscape card with channel logo */
.tile{flex:none;width:148px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;position:relative;cursor:pointer;scroll-snap-align:start;background:#222;transition:transform .15s}
.tile:active{transform:scale(.96)}
.tile .tbg{position:absolute;inset:0}
.tile .tlogo{position:absolute;inset:0;display:grid;place-items:center;padding:12% 20% 22%}
.tile .tlogo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.tinit{font-weight:900;font-size:26px;color:#fff;opacity:.95}
.tile .tname{position:absolute;bottom:0;left:0;right:0;padding:12px 7px 4px;font-size:11px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.85));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .badge{position:absolute;top:5px;inset-inline-start:5px;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:0 5px;border-radius:3px}
.tile .bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.25)}
.tile .bar i{display:block;height:100%;background:var(--red)}
.tile.recent{width:180px}

/* top 10 */
.topn{display:flex;align-items:flex-end;flex:none;cursor:pointer;scroll-snap-align:start}
.topn .num{font-size:118px;font-weight:900;line-height:.78;color:#000;-webkit-text-stroke:3px #595959;letter-spacing:-8px;direction:ltr;margin-inline-end:-14px;z-index:0}
.topn .ptile{width:96px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;position:relative;z-index:1;box-shadow:-6px 0 14px rgba(0,0,0,.6)}
.topn .ptile .tlogo{position:absolute;inset:0;display:grid;place-items:center;padding:18%}
.topn .ptile img{max-width:100%;max-height:60%;object-fit:contain}
.topn .ptile .tname{position:absolute;bottom:0;left:0;right:0;padding:16px 6px 6px;font-size:11px;font-weight:700;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.9))}

/* generic logo square (hero, detail, player queue) */
.logo{--s:48px;width:var(--s);height:var(--s);border-radius:calc(var(--s)*.2);position:relative;overflow:hidden;flex:none;display:grid;place-items:center}
.logo span{color:#fff;font-weight:900;font-size:calc(var(--s)*.32);line-height:1}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:14%;opacity:0;transition:opacity .25s}
.logo.ok{background:#2a2a2a!important}
.logo.ok img{opacity:1}
.logo.ok span{visibility:hidden}

/* pages */
.muted{color:var(--fg2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.grid .tile{width:auto}
@media (max-width:380px){.grid{grid-template-columns:repeat(2,1fr)}}
.empty{text-align:center;padding:60px 20px;color:var(--fg2);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty svg{width:64px;height:64px;color:#444}
.empty h3{color:#fff;font-size:21px;margin:4px 0 0;font-weight:800}
.empty p{margin:0;max-width:32ch}
.empty .btn{flex:none;padding:10px 26px;margin-top:8px}

/* detail */
.dart{position:relative;aspect-ratio:16/9;max-height:420px;width:100%;overflow:hidden;background:#111}
.dart .bgart{position:absolute;inset:-10%;filter:blur(30px) saturate(1.4);opacity:.9}
.dart .center{position:absolute;inset:0;display:grid;place-items:center}
.dart .center .logo{--s:110px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.dart .shade{position:absolute;inset:0;background:linear-gradient(transparent 55%,#000)}
.dart .playov{position:absolute;bottom:12px;inset-inline-start:max(12px,env(safe-area-inset-right,0px));width:46px;height:46px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;background:rgba(0,0,0,.4)}
.dart .playov svg{width:22px;height:22px}
.dclose{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);inset-inline-end:max(12px,env(safe-area-inset-left,0px));width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:2}
.dclose svg{width:18px;height:18px}
.dbody{display:flex;flex-direction:column;gap:10px;padding-top:12px}
.dbody h1{margin:0;font-size:24px;font-weight:900;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--fg2)}
.hd{border:1px solid #888;border-radius:3px;padding:0 4px;font-size:10px;font-weight:800;color:#ccc}
.acts{display:flex;justify-content:space-around;margin:6px 0 4px}
.act{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--fg2);min-width:72px}
.act svg{width:26px;height:26px;color:#fff}
.act.on svg{color:var(--red)}
.dinfo{font-size:13px;color:var(--fg2);overflow-wrap:anywhere}
.dinfo b{color:#ddd;font-weight:600}
.mono{direction:ltr;unicode-bidi:plaintext;font-family:ui-monospace,Menlo,monospace;font-size:12px}
.tabsh{display:flex;gap:20px;border-top:1px solid var(--sep);margin-top:10px}
.tabsh span{padding:10px 0;font-weight:800;font-size:15px;border-top:4px solid var(--red);margin-top:-1px}

/* search */
.sbox{display:flex;align-items:center;gap:8px;background:#2a2a2a;border-radius:6px;padding:9px 12px}
.sbox svg{width:20px;height:20px;color:#999;flex:none}
.sbox input{border:0;background:none;flex:1;min-width:0;font-size:16px;outline:none;color:#fff}
.sbox input::placeholder{color:#8c8c8c}
.sres{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.srow{display:flex;align-items:center;gap:12px;cursor:pointer;background:#141414;border-radius:4px;overflow:hidden;min-width:0}
.srow .tile{width:132px;border-radius:0}
.srow .sn{flex:1;min-width:0;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .sn small{display:block;font-weight:400;font-size:12px;color:var(--fg3)}
.pcirc{width:34px;height:34px;border-radius:50%;border:1.5px solid #fff;display:grid;place-items:center;margin-inline-end:12px;flex:none}
.pcirc svg{width:14px;height:14px}
.sech{font-size:19px;font-weight:800;margin:18px 0 8px}

/* playlists */
.pl{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--sep);cursor:pointer;min-width:0}
.plic{width:54px;height:54px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.plic svg{width:26px;height:26px}
.pl .m{flex:1;min-width:0}
.pl .t{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .s{font-size:13px;color:var(--fg2)}
.pl small{display:block;font-size:12px;color:var(--fg3)}
.pla{display:flex;gap:6px;flex:none}
.mini{font-size:13px;font-weight:700;padding:5px 12px;border-radius:4px;background:#2a2a2a;color:#fff}
.mini.red{color:#ff4d55}
.mini.redfill{background:var(--red);color:#fff}

/* category overlay */
.cats{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 70px) 16px calc(env(safe-area-inset-bottom,0px) + 110px);opacity:0;pointer-events:none;transition:opacity .2s}
.cats.open{opacity:1;pointer-events:auto}
.cats button.ci{font-size:19px;color:#b3b3b3;padding:11px 0;font-weight:600}
.cats button.ci.on{color:#fff;font-weight:900;font-size:22px}
.cats .cx{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);left:50%;transform:translateX(-50%);width:58px;height:58px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center}
.cats .cx svg{width:24px;height:24px}

/* tab bar */
#tabbar{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));background:rgba(18,18,18,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:#808080;min-width:64px;padding:2px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:#fff}

/* player */
.player{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);transform:translateY(102%);transition:transform .38s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.player.open{transform:none;visibility:visible}
.phead{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.circle{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.13);display:grid;place-items:center;flex:none;color:#fff}
.circle svg{width:20px;height:20px}
.circle.on{color:var(--red)}
.pti{flex:1;min-width:0;text-align:center}
.pti .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pti .g{color:rgba(255,255,255,.6);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;max-height:60vh}
.pv video{width:100%;height:100%;display:block;background:#000}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pv .spin{position:absolute;top:50%;left:50%;margin:-15px 0 0 -15px;pointer-events:none}
.perr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;background:#000}
.perr b{font-size:17px}
.perr p{margin:0;font-size:13px;color:rgba(255,255,255,.62);max-width:36ch}
.perr svg{width:40px;height:40px;color:var(--red)}
.pctl{display:flex;justify-content:center;align-items:center;gap:40px;padding:16px;direction:ltr}
.pctl button{color:#fff}
.pctl button:disabled{opacity:.3}
.pctl svg{width:30px;height:30px}
.qh{font-size:18px;font-weight:800;padding:4px max(16px,env(safe-area-inset-right,0px)) 8px}
.queue{flex:1;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-overflow-scrolling:touch}
.qrow{display:flex;align-items:center;gap:12px;padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));cursor:pointer;min-width:0}
.qrow .n{flex:1;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.on{background:rgba(229,9,20,.14)}
.qrow.on .n{font-weight:800}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px}
.eq i{width:3px;background:var(--red);border-radius:2px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
.sheet-wrap.open{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;max-height:92%;overflow-y:auto;background:#181818;border-radius:14px 14px 0 0;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.open .sheet{transform:none}
.shead{display:flex;align-items:center;justify-content:space-between;padding:16px 0 10px;position:sticky;top:0;background:#181818;z-index:1}
.shead b{font-size:17px;font-weight:800}
.shead button{font-size:16px;color:#b3b3b3}
.shead .ok{color:#fff;background:var(--red);padding:4px 16px;border-radius:4px;font-weight:800}
.shead button:disabled{opacity:.4}
.glabel{font-size:13px;color:var(--fg2);margin:18px 4px 6px;font-weight:600}
.gnote{font-size:12px;color:var(--fg3);margin:6px 4px 0}
.grp{background:#2a2a2a;border-radius:8px;overflow:hidden}
.grp input,.grp textarea{width:100%;border:0;padding:12px 14px;font-size:16px;background:transparent;outline:none;display:block;color:#fff}
.grp input::placeholder,.grp textarea::placeholder{color:#8c8c8c}
.grp textarea{min-height:90px;resize:vertical;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;font-size:13px}
.grp>*+*{border-top:1px solid rgba(255,255,255,.08)}
.ltr{direction:ltr;text-align:left}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:start;color:#fff;cursor:pointer}
.opt svg{width:22px;height:22px;flex:none;color:var(--red)}
.err{color:#ff4d55;font-size:14px;margin:12px 4px 0}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:#000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:6px;z-index:80;max-width:min(92vw,420px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)}

/* lock */
.lock{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));background:radial-gradient(120% 70% at 50% 0%,rgba(229,9,20,.22),transparent 60%),#000;text-align:center}
.lock .brand{font-size:72px}
.lock p{margin:0;color:var(--fg2);font-size:15px}
.lock form{display:flex;flex-direction:column;gap:12px;width:100%;max-width:320px;margin-top:10px}
.lock input{width:100%;font-size:17px;padding:14px 16px;border-radius:6px;border:1px solid #444;background:rgba(40,40,40,.85);text-align:center;outline:none;direction:ltr;letter-spacing:.08em;color:#fff}
.lock input:focus{border-color:#fff}
.lock button{background:var(--red);color:#fff;font-weight:800;font-size:17px;padding:13px;border-radius:6px}
.lock button:disabled{opacity:.6}
.lock .lerr{color:#ff4d55;font-size:14px;min-height:20px}
.lock.shake form{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" defer></script>
<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const PAL = [["#e50914","#5c0a0f"],["#1f6feb","#0b1f44"],["#f5a524","#5a3205"],["#16a34a","#073d1c"],["#a21caf","#3b0a40"],["#0891b2","#063945"],["#db2777","#4d0a27"],["#6b7280","#1f2329"]];
function hash(s){ let h = 5381; for (const ch of String(s)) h = (h * 33 + ch.codePointAt(0)) >>> 0; return h; }
const pal = (k) => PAL[hash(k) % PAL.length];
const grad = (k) => { const p = pal(k); return `linear-gradient(135deg,${p[0]},${p[1]})`; };
const tileBg = (k) => { const p = pal(k); return `radial-gradient(120% 120% at 70% 20%,${p[0]}cc,${p[1]} 55%,#111 100%)`; };
function initials(n){
  const w = String(n).split(/[\s\-_|]+/).filter(Boolean);
  if (!w.length) return "TV";
  if (/[؀-ۿ]/.test(w[0])){ const a = w[0].replace(/^ال(?=..)/, ""); return [...a].slice(0, 2).join(""); }
  return w.slice(0, 2).map((x) => [...x][0]).join("").toUpperCase();
}
const fmtN = (n) => n.toLocaleString("ar");

const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 2.5 10.5V21h7v-6h5v6h7V10.5L12 3Z"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>',
  mylist:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>',
  lists:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="13" rx="2"/><path d="M8 21h8M10 9.5v5l4-2.5-4-2.5Z" fill="currentColor"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4.5 12.5 5 5 10-11"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>',
  heartF:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 20.5S3.5 15.6 3.5 9.8A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.6c0 5.8-8.5 10.7-8.5 10.7Z"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20.5S3.5 15.6 3.5 9.8A4.6 4.6 0 0 1 12 7.2a4.6 4.6 0 0 1 8.5 2.6c0 5.8-8.5 10.7-8.5 10.7Z"/></svg>',
  file:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm7 1.5V9h5.5L13 3.5Z"/></svg>',
  antenna:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M8 8a5.6 5.6 0 0 0 0 8M16 8a5.6 5.6 0 0 1 0 8M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  tv:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="m8.5 2.5 3.5 3.5 3.5-3.5"/></svg>',
};

/* ---------- category names ---------- */
const AR_GROUPS = { news:"أخبار", sports:"رياضة", entertainment:"ترفيه", general:"عامة", religious:"دينية", kids:"أطفال", movies:"أفلام", music:"موسيقى", documentary:"وثائقية", culture:"ثقافة", series:"مسلسلات", business:"اقتصاد", education:"تعليم", lifestyle:"أسلوب حياة", undefined:"متنوعة", cooking:"طبخ", comedy:"كوميديا", family:"عائلة", science:"علوم", travel:"سفر", weather:"طقس", shop:"تسوق", outdoor:"طبيعة", classic:"كلاسيكية", auto:"سيارات", animation:"رسوم متحركة", legislative:"برلمانية", relax:"استرخاء", public:"حكومية", quran:"قرآن" };
function groupName(raw){
  const first = String(raw || "").split(";")[0].trim();
  if (!first) return "عامة";
  return AR_GROUPS[first.toLowerCase()] || first;
}

/* ---------- M3U parser ---------- */
function parseInfo(line){
  const attrs = {};
  for (const m of line.matchAll(/([A-Za-z0-9_-]+)\s*=\s*"([^"]*)"/g)) attrs[m[1].toLowerCase()] = m[2].trim();
  let q = false, idx = -1;
  for (let i = 0; i < line.length; i++){ const c = line[i]; if (c === '"') q = !q; else if (c === "," && !q){ idx = i; break; } }
  return { name: idx >= 0 ? line.slice(idx + 1).trim() : "", attrs };
}
function parseM3U(text){
  const out = []; let info = null, grp = null;
  for (let line of String(text).replace(/\r\n?/g, "\n").split("\n")){
    line = line.replace(/^﻿/, "").trim();
    if (!line) continue;
    const up = line.toUpperCase();
    if (up.startsWith("#EXTINF")){ info = parseInfo(line); grp = null; }
    else if (up.startsWith("#EXTGRP:")){ grp = line.slice(8).trim(); }
    else if (line.startsWith("#")) continue;
    else if (/^[a-z][a-z0-9+.-]*:\/\//i.test(line)){
      const a = info ? info.attrs : {};
      let name = (info && info.name) || a["tvg-name"] || "";
      if (!name){ try { name = decodeURIComponent(line.split("?")[0].split("/").pop()); } catch { name = "قناة"; } }
      out.push({ id: uid(), name, url: line, logo: a["tvg-logo"] || "", group: groupName(a["group-title"] || grp), tvgId: a["tvg-id"] || "", country: a["tvg-country"] || "", language: a["tvg-language"] || "" });
      info = null; grp = null;
    }
  }
  return out;
}

/* ---------- state ---------- */
const KEY = "bath.v1";
const SAMPLES = [
  { t: "قنوات عربية", u: "https://iptv-org.github.io/iptv/languages/ara.m3u" },
  { t: "قنوات إخبارية", u: "https://iptv-org.github.io/iptv/categories/news.m3u" },
  { t: "قنوات رياضية", u: "https://iptv-org.github.io/iptv/categories/sports.m3u" },
];
let S = { playlists: [], favorites: [], recents: [] };
let groups = [], byId = new Map(), lastSearch = [], heroPick = null;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); S = { playlists: d.playlists || [], favorites: d.favorites || [], recents: d.recents || [] }; } } catch {}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch { toast("مساحة التخزين ممتلئة. احذف قائمة كبيرة ثم حاول مجددًا."); }
}
function rebuild(){
  byId = new Map();
  const m = new Map();
  for (const p of S.playlists) for (const c of p.channels){
    byId.set(c.id, c);
    if (!m.has(c.group)) m.set(c.group, []);
    m.get(c.group).push(c);
  }
  for (const c of S.favorites) if (!byId.has(c.id)) byId.set(c.id, c);
  for (const c of S.recents) if (!byId.has(c.id)) byId.set(c.id, c);
  groups = [...m].map(([name, channels]) => ({ name, channels }));
}
const isFav = (c) => S.favorites.some((x) => x.url === c.url);
function toggleFav(c){
  if (isFav(c)){ S.favorites = S.favorites.filter((x) => x.url !== c.url); toast("أُزيلت من قائمتي"); }
  else { S.favorites.unshift(c); toast("أُضيفت إلى قائمتي"); }
  save(); rebuild();
}
function markPlayed(c){ S.recents = [c, ...S.recents.filter((x) => x.url !== c.url)].slice(0, 20); save(); rebuild(); }
const groupOf = (name) => groups.find((g) => g.name === name);
const playlistOf = (c) => S.playlists.find((p) => p.channels.some((x) => x.id === c.id));
const sortedGroups = () => [...groups].sort((a, b) => b.channels.length - a.channels.length);

async function fetchList(url){
  let res;
  try { res = await fetch(url, { cache: "no-store" }); }
  catch { throw new Error("تعذّر الوصول إلى الرابط. قد يمنع المزوّد قراءة القائمة من المتصفح؛ احفظ الملف واستورده، أو الصق محتواه."); }
  if (!res.ok) throw new Error(`الخادم رد بالخطأ ${res.status}. تأكد من صحة الرابط.`);
  const list = parseM3U(await res.text());
  if (!list.length) throw new Error("لم يتم العثور على قنوات في هذه القائمة.");
  return list;
}
async function addFromUrl(name, url){
  url = url.trim();
  if (!/^https?:\/\//i.test(url)) throw new Error("الرابط يجب أن يبدأ بـ http أو https.");
  const channels = await fetchList(url);
  let host = ""; try { host = new URL(url).hostname; } catch {}
  S.playlists.push({ id: uid(), name: name.trim() || host || "قائمة جديدة", source: url, channels, updatedAt: Date.now() });
  save(); rebuild(); heroPick = null;
  return channels.length;
}
function addFromText(name, text){
  const channels = parseM3U(text);
  if (!channels.length) throw new Error("لم يتم العثور على قنوات. تأكد أن النص يبدأ بـ ‎#EXTM3U.");
  S.playlists.push({ id: uid(), name: name.trim() || "قائمة مستوردة", source: "", channels, updatedAt: Date.now() });
  save(); rebuild(); heroPick = null;
  return channels.length;
}
async function refreshPl(id){
  const p = S.playlists.find((x) => x.id === id); if (!p || !p.source) return;
  toast("جارٍ التحديث…");
  try { p.channels = await fetchList(p.source); p.updatedAt = Date.now(); save(); rebuild(); heroPick = null; render(); toast(`تم التحديث: ${fmtN(p.channels.length)} قناة`); }
  catch (e){ toast(e.message); }
}

/* ---------- UI pieces ---------- */
function logo(c, s){
  const img = c.logo ? `<img src="${esc(c.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onload="this.parentNode.classList.add('ok')" onerror="this.remove()">` : "";
  return `<div class="logo" style="--s:${s}px;background:${grad(c.name)}"><span>${esc(initials(c.name))}</span>${img}</div>`;
}
function tileArt(c, size){
  const ini = `<span class="tinit"${size ? ` style="font-size:${size}px"` : ""}>${esc(initials(c.name))}</span>`;
  if (!c.logo) return ini;
  return `<img src="${esc(c.logo)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.insertAdjacentHTML('afterend','${esc(ini).replace(/'/g, "&#39;")}');this.remove()">`;
}
function tile(c, q, opts = {}){
  const act = opts.play ? `data-play="${c.id}" data-q="${esc(q)}"` : `data-ch="${c.id}" data-q="${esc(q)}"`;
  return `<div class="tile ${opts.cls || ""}" ${act}><div class="tbg" style="background:${tileBg(c.name)}"></div><div class="tlogo">${tileArt(c)}</div>${opts.badge ? `<span class="badge">${opts.badge}</span>` : ""}<div class="tname">${esc(c.name)}</div>${opts.bar ? `<div class="bar"><i style="width:${opts.bar}%"></i></div>` : ""}</div>`;
}
function row(title, list, q, opts = {}){
  if (!list.length) return "";
  const head = opts.grp ? `<div class="rowh" data-grp="${esc(opts.grp)}"><h3>${esc(title)}</h3><span class="more">عرض الكل${ICON.chev}</span></div>` : `<div class="rowh"><h3>${esc(title)}</h3></div>`;
  return `<section>${head}<div class="strip bleed">${list.map((c, i) => tile(c, q, typeof opts.tile === "function" ? opts.tile(c, i) : (opts.tile || {}))).join("")}</div></section>`;
}
function topTen(g){
  const list = g.channels.slice(0, 10);
  return `<section><div class="rowh" data-grp="${esc(g.name)}"><h3>الأكثر 10 في ${esc(g.name)}</h3><span class="more">عرض الكل${ICON.chev}</span></div>
    <div class="strip bleed">${list.map((c, i) => `<div class="topn" data-ch="${c.id}" data-q="g:${esc(g.name)}"><span class="num">${i + 1}</span><div class="ptile" style="background:${tileBg(c.name)}"><div class="tlogo">${tileArt(c, 28)}</div><div class="tname">${esc(c.name)}</div></div></div>`).join("")}</div></section>`;
}
function empty(icon, title, text, extra){ return `<div class="empty">${icon}<h3>${title}</h3><p>${text}</p>${extra || ""}</div>`; }
function backBar(title){
  return `<div class="tb-row gut wrap"><button class="tb-btn" data-back aria-label="رجوع">${ICON.back}</button><div class="tb-title" style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</div></div>`;
}

/* ---------- views: each returns { bar, body, overlay?, hideBar? } ---------- */
function vHome(e){
  const bar = `<div class="tb-row gut wrap"><div class="brand">بث</div><span class="tb-sp"></span>
      <button class="tb-btn" data-tab="search" aria-label="بحث">${ICON.search}</button>
      <button class="tb-btn" data-act="add" aria-label="إضافة قائمة">${ICON.plus}</button></div>
    <div class="chips gut wrap"><button class="chip${!e.filter ? " on" : ""}" data-filter="">الكل</button><button class="chip" data-tab="mylist">قائمتي</button><button class="chip${e.filter ? " on" : ""}" data-act="cats">${e.filter ? esc(e.filter) : "المجموعات"}${ICON.down}</button>${e.filter ? `<button class="chip" data-filter="" aria-label="إلغاء التصفية">${ICON.x}</button>` : ""}</div>`;
  if (!S.playlists.length){
    return { bar, body: `<div class="under-bar"></div><div class="gut wrap">${empty(ICON.tv, "أضف أول قائمة M3U", "الصق رابط قائمتك أو استورد ملفًا، وتظهر قنواتك هنا في صفوف مرتبة حسب المجموعات.", `<button class="btn r" data-act="add">${ICON.plus}إضافة قائمة</button>`)}</div>` };
  }
  let gs = sortedGroups();
  if (e.filter) gs = gs.filter((g) => g.name === e.filter);
  const pool = gs.length ? gs : sortedGroups();
  if (!heroPick || !byId.has(heroPick) || (e.filter && byId.get(heroPick).group !== e.filter)){
    const cands = pool[0].channels.slice(0, 12);
    const withLogo = cands.filter((c) => c.logo);
    const arr = withLogo.length ? withLogo : cands;
    heroPick = arr[Math.floor(Math.random() * arr.length)].id;
  }
  const h = byId.get(heroPick), fav = isFav(h);
  let body = `<div class="under-bar"></div><div class="gut wrap">
    <div class="hero">
      <div class="bgart" style="background:${tileBg(h.name)}"></div>
      ${h.logo ? `<img class="bgimg" src="${esc(h.logo)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="center">${logo(h, 150)}</div>
      <div class="shade"></div>
      <div class="info">
        <h2>${esc(h.name)}</h2>
        <div class="tags"><span class="livepill"><i></i>مباشر</span><span>${esc(h.group)}</span>${h.country ? `<span class="dot"></span><span>${esc(h.country)}</span>` : ""}</div>
        <div class="hbtns">
          <button class="btn w" data-play="${h.id}" data-q="g:${esc(h.group)}">${ICON.play}تشغيل</button>
          <button class="btn g" data-fav="${h.id}">${fav ? ICON.check : ICON.plus}قائمتي</button>
        </div>
      </div>
    </div>
    <div class="rows">`;
  if (!e.filter){
    if (S.recents.length) body += row("تابع المشاهدة", S.recents.slice(0, 15), "rec", { tile: (c) => ({ play: true, cls: "recent", bar: 25 + (hash(c.url) % 60) }) });
    if (S.favorites.length) body += row("قائمتي", S.favorites.slice(0, 20), "fav");
    if (gs[0] && gs[0].channels.length >= 5) body += topTen(gs[0]);
  }
  gs.forEach((g, i) => {
    body += row(g.name, g.channels.slice(0, 25), "g:" + g.name, { grp: g.name, tile: (c, j) => (j < 2 && i % 3 === 0 ? { badge: "مباشر" } : {}) });
  });
  body += `</div></div>`;
  return { bar, body, overlay: true };
}
function vGroup(e){
  const g = groupOf(e.name);
  if (!g) return { bar: backBar(""), body: `<div class="under-bar short"></div><div class="gut wrap">${empty(ICON.tv, "المجموعة غير موجودة", "ربما حُذفت القائمة.")}</div>` };
  return { bar: backBar(g.name), body: `<div class="under-bar short"></div><div class="gut wrap">
    <p class="muted" style="margin:0 0 10px">${fmtN(g.channels.length)} قناة</p>
    <div class="grid">${g.channels.map((c) => tile(c, "g:" + g.name)).join("")}</div></div>` };
}
function vChannel(e){
  const c = byId.get(e.id);
  if (!c) return { bar: backBar(""), body: `<div class="under-bar short"></div><div class="gut wrap">${empty(ICON.tv, "القناة غير موجودة", "ربما تم تحديث القائمة.")}</div>` };
  const g = groupOf(c.group), sib = g ? g.channels : [c], fav = isFav(c), pl = playlistOf(c);
  const ext = (c.url.split("?")[0].split(".").pop() || "").toLowerCase();
  const kind = { m3u8: "HLS", mp4: "MP4", ts: "TS", mp3: "صوت", aac: "صوت" }[ext] || "STREAM";
  const others = sib.filter((x) => x.id !== c.id).slice(0, 24);
  return { bar: "", hideBar: true, body: `
    <div class="dart">
      <div class="bgart" style="background:${tileBg(c.name)}"></div>
      <div class="center">${logo(c, 110)}</div>
      <div class="shade"></div>
      <button class="playov" data-play="${c.id}" data-q="g:${esc(c.group)}" aria-label="تشغيل">${ICON.play}</button>
      <button class="dclose" data-back aria-label="إغلاق">${ICON.x}</button>
    </div>
    <div class="gut wrap"><div class="dbody">
      <h1>${esc(c.name)}</h1>
      <div class="meta"><span class="livepill"><i></i>مباشر</span><span>${esc(c.group)}</span>${c.country ? `<span>${esc(c.country)}</span>` : ""}<span class="hd">${kind}</span></div>
      <button class="btn w" data-play="${c.id}" data-q="g:${esc(c.group)}">${ICON.play}تشغيل</button>
      <div class="dinfo"><b>القائمة:</b> ${esc(pl ? pl.name : "—")} · <b>المجموعة:</b> ${esc(c.group)} (${fmtN(sib.length)} قناة)${c.language ? ` · <b>اللغة:</b> ${esc(c.language.split(";")[0])}` : ""}</div>
      <div class="dinfo"><b>الرابط:</b> <span class="mono">${esc(c.url)}</span></div>
      <div class="acts">
        <button class="act${fav ? " on" : ""}" data-fav="${c.id}">${fav ? ICON.check : ICON.plus}قائمتي</button>
        <button class="act" data-copy="${esc(c.url)}">${ICON.copy}نسخ الرابط</button>
        <button class="act" data-grp="${esc(c.group)}">${ICON.info}المجموعة</button>
      </div>
      ${others.length ? `<div class="tabsh"><span>المزيد مثل هذا</span></div><div class="grid" style="margin-bottom:20px">${others.map((o) => tile(o, "g:" + c.group)).join("")}</div>` : ""}
    </div></div>` };
}
function vSearch(e){
  return { bar: `<div class="tb-row gut wrap"><div class="tb-title">بحث</div></div>`, body: `<div class="under-bar short"></div><div class="gut wrap">
    <label class="sbox">${ICON.search}<input id="sq" type="search" placeholder="ابحث عن قناة أو مجموعة" value="${esc(e.q || "")}" autocomplete="off" enterkeyhint="search"></label>
    <div id="sres">${searchBody(e.q || "")}</div></div>` };
}
function srow(c, q){
  return `<div class="srow" data-ch="${c.id}" data-q="${esc(q)}">${tile(c, q)}<div class="sn">${esc(c.name)}<small>${esc(c.group)}</small></div><button class="pcirc" data-play="${c.id}" data-q="${esc(q)}" aria-label="تشغيل">${ICON.play}</button></div>`;
}
function searchBody(q){
  q = q.trim();
  if (!q){
    if (!groups.length) return empty(ICON.search, "لا يوجد ما نبحث فيه", "أضف قائمة أولًا من تبويب «القوائم».");
    const sug = (S.recents.length ? S.recents : sortedGroups()[0].channels).slice(0, 12);
    lastSearch = sug;
    return `<div class="sech">مقترحات لك</div><div class="sres">${sug.map((c) => srow(c, "srch")).join("")}</div>`;
  }
  const ql = q.toLowerCase(), res = [];
  outer: for (const g of groups) for (const c of g.channels){
    if (c.name.toLowerCase().includes(ql) || c.group.toLowerCase().includes(ql)){ res.push(c); if (res.length >= 200) break outer; }
  }
  lastSearch = res;
  if (!res.length) return empty(ICON.search, `لا نتائج لـ «${esc(q)}»`, "تحقق من الإملاء أو جرّب كلمة أخرى.");
  return `<div class="sech">أفضل النتائج</div><div class="sres">${res.map((c) => srow(c, "srch")).join("")}</div>`;
}
function vMyList(){
  const bar = `<div class="tb-row gut wrap"><div class="tb-title">قائمتي</div></div>`;
  if (!S.favorites.length) return { bar, body: `<div class="under-bar short"></div><div class="gut wrap">${empty(ICON.mylist, "قائمتك فارغة", "اضغط «قائمتي» في صفحة أي قناة لإضافتها هنا والرجوع لها بسرعة.")}</div>` };
  return { bar, body: `<div class="under-bar short"></div><div class="gut wrap"><div class="grid">${S.favorites.map((c) => tile(c, "fav", { play: true })).join("")}</div></div>` };
}
let pendingDel = null;
function relTime(t){
  const s = Math.round((t - Date.now()) / 1000), rtf = new Intl.RelativeTimeFormat("ar", { numeric: "auto" }), a = Math.abs(s);
  if (a < 60) return rtf.format(s, "second");
  if (a < 3600) return rtf.format(Math.round(s / 60), "minute");
  if (a < 86400) return rtf.format(Math.round(s / 3600), "hour");
  return rtf.format(Math.round(s / 86400), "day");
}
function vLists(){
  const bar = `<div class="tb-row gut wrap"><div class="tb-title">القوائم</div><span class="tb-sp"></span><button class="tb-btn" data-act="lock" aria-label="قفل التطبيق">${ICON.lock}</button><button class="tb-btn" data-act="add" aria-label="إضافة قائمة">${ICON.plus}</button></div>`;
  let body = `<div class="under-bar short"></div><div class="gut wrap">`;
  if (!S.playlists.length) return { bar, body: body + empty(ICON.lists, "لا توجد قوائم", "أضف رابط M3U أو استورد ملفًا من جهازك.", `<button class="btn r" data-act="add">${ICON.plus}إضافة قائمة</button>`) + "</div>" };
  body += S.playlists.map((p) => {
    const gc = new Set(p.channels.map((c) => c.group)).size;
    const actions = pendingDel === p.id
      ? `<button class="mini" data-act="cancelDel">إلغاء</button><button class="mini redfill" data-act="delok" data-id="${p.id}">حذف</button>`
      : `${p.source ? `<button class="mini" data-act="refresh" data-id="${p.id}">تحديث</button>` : ""}<button class="mini red" data-act="del" data-id="${p.id}">حذف</button>`;
    return `<div class="pl" data-pl="${p.id}"><div class="plic" style="background:${grad(p.name)}">${p.source ? ICON.antenna : ICON.file}</div>
      <div class="m"><div class="t">${esc(p.name)}</div><div class="s">${fmtN(p.channels.length)} قناة · ${fmtN(gc)} مجموعة</div><small>آخر تحديث ${relTime(p.updatedAt)}</small></div>
      <div class="pla">${actions}</div></div>`;
  }).join("");
  return { bar, body: body + `<p class="muted" style="font-size:13px;margin-top:16px">تُحفظ القوائم على هذا الجهاز فقط.</p><button class="btn r" data-act="add" style="width:100%;margin-top:6px">${ICON.plus}إضافة قائمة جديدة</button></div>` };
}
function vPlaylist(e){
  const p = S.playlists.find((x) => x.id === e.id);
  if (!p) return { bar: backBar(""), body: `<div class="under-bar short"></div><div class="gut wrap">${empty(ICON.tv, "القائمة غير موجودة", "")}</div>` };
  const ids = new Set(p.channels.map((c) => c.id));
  const gs = [...new Set(p.channels.map((c) => c.group))].map(groupOf).filter(Boolean);
  return { bar: backBar(p.name), body: `<div class="under-bar short"></div><div class="gut wrap"><p class="muted" style="margin:0">${fmtN(p.channels.length)} قناة</p><div class="rows" style="margin-top:14px">${gs.map((g) => row(g.name, g.channels.filter((c) => ids.has(c.id)).slice(0, 25), "g:" + g.name, { grp: g.name })).join("")}</div></div>` };
}

/* ---------- navigation ---------- */
const VIEWS = { home: vHome, search: vSearch, mylist: vMyList, lists: vLists, grp: vGroup, ch: vChannel, pl: vPlaylist };
const TABS = [["home", "الرئيسية"], ["search", "بحث"], ["mylist", "قائمتي"], ["lists", "القوائم"]];
let tab = "home";
const stacks = Object.fromEntries(TABS.map(([k]) => [k, [{ v: k }]]));
const cur = () => stacks[tab][stacks[tab].length - 1];
function render(){
  const e = cur(), r = VIEWS[e.v](e);
  const tb = $("#topbar");
  tb.innerHTML = r.bar || ""; tb.hidden = !!r.hideBar;
  tb.dataset.overlay = r.overlay ? "1" : "";
  setBarStyle();
  $("#view").innerHTML = r.body;
  $("#tabbar").innerHTML = TABS.map(([k, t]) => `<button class="tab${k === tab ? " on" : ""}" data-tab="${k}">${ICON[k]}<span>${t}</span></button>`).join("");
  const sq = $("#sq");
  if (sq) sq.addEventListener("input", () => { e.q = sq.value; $("#sres").innerHTML = searchBody(sq.value); });
}
function setBarStyle(){
  const tb = $("#topbar"), over = tb.dataset.overlay === "1";
  const solid = !over || scrollY > 40;
  tb.classList.toggle("solid", solid); tb.classList.toggle("fade", !solid);
}
addEventListener("scroll", setBarStyle, { passive: true });
function push(e){ cur().y = scrollY; stacks[tab].push(e); render(); scrollTo(0, 0); }
function pop(){ const s = stacks[tab]; if (s.length > 1){ s.pop(); render(); scrollTo(0, cur().y || 0); } }
function switchTab(t){
  if (t === tab){ stacks[t].length = 1; render(); scrollTo({ top: 0, behavior: "smooth" }); return; }
  cur().y = scrollY; tab = t; render(); scrollTo(0, cur().y || 0);
}

/* ---------- categories overlay ---------- */
function openCats(){
  const f = stacks.home[0].filter || "";
  $("#cats").innerHTML = `<button class="ci${!f ? " on" : ""}" data-filter="">الرئيسية</button>${sortedGroups().map((g) => `<button class="ci${g.name === f ? " on" : ""}" data-filter="${esc(g.name)}">${esc(g.name)}</button>`).join("")}<button class="cx" data-act="closeCats" aria-label="إغلاق">${ICON.x}</button>`;
  $("#cats").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeCats(){ $("#cats").classList.remove("open"); document.body.style.overflow = ""; }

/* ---------- player ---------- */
const vid = $("#vid");
let Q = [], now = null, hls = null;
function resolveQueue(k){
  if (!k) return null;
  if (k.startsWith("g:")){ const g = groupOf(k.slice(2)); return g ? g.channels : null; }
  return { rec: S.recents, fav: S.favorites, srch: lastSearch }[k] || null;
}
function play(id, qk){
  const c = byId.get(id); if (!c) return;
  Q = (resolveQueue(qk) || [c]).slice();
  if (!Q.some((x) => x.id === c.id)) Q.unshift(c);
  $("#player").classList.add("open");
  document.body.style.overflow = "hidden";
  loadChannel(c);
}
function loadChannel(c){
  now = c;
  markPlayed(c);
  $("#pErr").hidden = true; $("#pSpin").hidden = false;
  if (hls){ hls.destroy(); hls = null; }
  const isHls = /\.m3u8($|\?)/i.test(c.url);
  if (isHls && !vid.canPlayType("application/vnd.apple.mpegurl") && window.Hls && window.Hls.isSupported()){
    hls = new window.Hls();
    hls.on(window.Hls.Events.ERROR, (_, d) => { if (d.fatal) showErr(); });
    hls.loadSource(c.url); hls.attachMedia(vid);
  } else {
    vid.src = c.url;
  }
  const p = vid.play(); if (p && p.catch) p.catch(() => {});
  playerUI();
}
function showErr(){
  if (!now) return;
  $("#pSpin").hidden = true; $("#pErr").hidden = false;
  $("#pErrMsg").textContent = (location.protocol === "https:" && /^http:/i.test(now.url))
    ? "هذا الرابط غير مشفّر (http) ولا يسمح Safari بتشغيله داخل صفحة آمنة. اطلب من المزوّد رابط https."
    : "قد يكون البث متوقفًا حاليًا أو بصيغة لا يدعمها Safari. جرّب قناة أخرى.";
}
vid.addEventListener("playing", () => { $("#pSpin").hidden = true; $("#pErr").hidden = true; });
vid.addEventListener("waiting", () => { $("#pSpin").hidden = false; });
vid.addEventListener("error", () => { if (vid.getAttribute("src")) showErr(); });
function playerUI(){
  const c = now; if (!c) return;
  $("#pName").textContent = c.name; $("#pGroup").textContent = c.group;
  const fav = isFav(c), fb = $("#pFav");
  fb.innerHTML = fav ? ICON.heartF : ICON.heart; fb.classList.toggle("on", fav);
  $("#pPrev").disabled = $("#pNext").disabled = Q.length < 2;
  $("#queue").innerHTML = Q.map((x) => `<div class="qrow${x.id === c.id ? " on" : ""}" data-qp="${x.id}">${logo(x, 44)}<div class="n">${esc(x.name)}</div>${x.id === c.id ? '<div class="eq"><i></i><i></i><i></i></div>' : ""}</div>`).join("");
  const on = $("#queue .qrow.on"); if (on) on.scrollIntoView({ block: "center" });
}
function step(d){
  if (!now || Q.length < 2) return;
  const i = Q.findIndex((x) => x.id === now.id);
  loadChannel(Q[(i + d + Q.length) % Q.length]);
}
function closePlayer(){
  $("#player").classList.remove("open");
  document.body.style.overflow = "";
  vid.pause();
  if (hls){ hls.destroy(); hls = null; }
  vid.removeAttribute("src"); vid.load();
  now = null;
  const y = scrollY; render(); scrollTo(0, y);
}

/* ---------- add sheet ---------- */
function openSheet(){
  $("#sheet").innerHTML = `
    <div class="shead"><button data-act="closeSheet">إلغاء</button><b>إضافة قائمة</b><button class="ok" id="addBtn" data-act="submit">إضافة</button></div>
    <div class="glabel">رابط M3U</div>
    <div class="grp"><input id="fName" placeholder="اسم القائمة (اختياري)" autocomplete="off"><input id="fUrl" class="ltr" type="url" inputmode="url" placeholder="https://example.com/playlist.m3u" autocapitalize="off" autocomplete="off" spellcheck="false"></div>
    <div class="gnote">يدعم روابط m3u و m3u8 مع الشعارات والمجموعات.</div>
    <div class="glabel">أو من جهازك</div>
    <div class="grp"><label class="opt" for="fFile">${ICON.file}استيراد ملف ‎.m3u</label><input id="fFile" type="file" accept=".m3u,.m3u8,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain" hidden></div>
    <div class="glabel">أو الصق محتوى القائمة</div>
    <div class="grp"><textarea id="fText" placeholder="#EXTM3U&#10;#EXTINF:-1 tvg-logo=&quot;…&quot; group-title=&quot;…&quot;,اسم القناة&#10;https://…/stream.m3u8"></textarea></div>
    <div class="glabel">قوائم مجانية للتجربة</div>
    <div class="grp">${SAMPLES.map((s) => `<button class="opt" data-sample="${esc(s.u)}" data-t="${esc(s.t)}">${ICON.globe}${s.t}</button>`).join("")}</div>
    <div class="err" id="fErr" hidden></div>`;
  $("#sheetWrap").classList.add("open");
  $("#fFile").addEventListener("change", (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => { try { const n = addFromText($("#fName").value || f.name.replace(/\.[^.]+$/, ""), r.result); closeSheet(); toast(`أُضيفت ${fmtN(n)} قناة`); render(); } catch (e){ sheetErr(e.message); } };
    r.readAsText(f);
  });
}
function closeSheet(){ $("#sheetWrap").classList.remove("open"); }
function sheetErr(m){ const e = $("#fErr"); e.textContent = m; e.hidden = !m; }
async function submitSheet(){
  const name = $("#fName").value, url = $("#fUrl").value, text = $("#fText").value;
  sheetErr("");
  const btn = $("#addBtn"); btn.disabled = true; btn.textContent = "جارٍ…";
  try {
    let n;
    if (url.trim()) n = await addFromUrl(name, url);
    else if (text.trim()) n = addFromText(name, text);
    else throw new Error("أدخل رابط القائمة أو الصق محتواها.");
    closeSheet(); toast(`أُضيفت ${fmtN(n)} قناة`); render();
  } catch (e){ sheetErr(e.message); }
  finally { btn.disabled = false; btn.textContent = "إضافة"; }
}

/* ---------- toast ---------- */
let toastT;
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600); }

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("[data-play],[data-qp],[data-ch],[data-grp],[data-tab],[data-back],[data-fav],[data-act],[data-copy],[data-pl],[data-sample],[data-filter]");
  if (!t) return;
  const d = t.dataset;
  if (d.play) play(d.play, d.q);
  else if (d.qp){ const c = byId.get(d.qp) || Q.find((x) => x.id === d.qp); if (c) loadChannel(c); }
  else if (d.ch) push({ v: "ch", id: d.ch });
  else if (d.grp !== undefined) push({ v: "grp", name: d.grp });
  else if (d.tab){ closeCats(); switchTab(d.tab); }
  else if (d.back !== undefined) pop();
  else if (d.pl) push({ v: "pl", id: d.pl });
  else if (d.filter !== undefined){ closeCats(); tab = "home"; stacks.home.length = 1; stacks.home[0].filter = d.filter; heroPick = null; render(); scrollTo(0, 0); }
  else if (d.fav){ const c = byId.get(d.fav); if (c){ toggleFav(c); const y = scrollY; render(); scrollTo(0, y); } }
  else if (d.sample){ $("#fName").value = d.t; $("#fUrl").value = d.sample; $("#fText").value = ""; }
  else if (d.copy){
    const done = () => toast("تم نسخ الرابط");
    if (navigator.clipboard) navigator.clipboard.writeText(d.copy).then(done, () => toast(d.copy)); else toast(d.copy);
  }
  else if (d.act){
    ev.stopPropagation();
    switch (d.act){
      case "add": openSheet(); break;
      case "lock": lockApp(); break;
      case "cats": openCats(); break;
      case "closeCats": closeCats(); break;
      case "closeSheet": closeSheet(); break;
      case "closeSheetBg": if (ev.target === t) closeSheet(); break;
      case "submit": submitSheet(); break;
      case "closePlayer": closePlayer(); break;
      case "prev": step(-1); break;
      case "next": step(1); break;
      case "pfav": if (now){ toggleFav(now); playerUI(); } break;
      case "refresh": refreshPl(d.id); break;
      case "del": pendingDel = d.id; render(); break;
      case "cancelDel": pendingDel = null; render(); break;
      case "delok": S.playlists = S.playlists.filter((p) => p.id !== d.id); pendingDel = null; save(); rebuild(); heroPick = null; render(); toast("حُذفت القائمة"); break;
    }
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape"){
    if ($("#cats").classList.contains("open")) closeCats();
    else if ($("#sheetWrap").classList.contains("open")) closeSheet();
    else if (now) closePlayer();
  }
});

/* ---------- lock ---------- */
const LOCK_SALT = "30477e9b7c07c149";
const LOCK_HASH = "ddd584e9efea764328f0d34460c1cc0d7a5cec54a24aabe6d6367842ae93b701";
const UNLOCK_KEY = "bath.unlock";
async function derive(pw){
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", salt: enc.encode(LOCK_SALT), iterations: 150000, hash: "SHA-256" }, key, 256);
  return [...new Uint8Array(bits)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function unlocked(){ try { return localStorage.getItem(UNLOCK_KEY) === LOCK_HASH; } catch { return false; } }
function startApp(){ $("#lock").hidden = true; load(); rebuild(); render(); }
function lockApp(){
  if (now) closePlayer();
  try { localStorage.removeItem(UNLOCK_KEY); } catch {}
  $("#view").innerHTML = ""; $("#tabbar").innerHTML = ""; $("#topbar").innerHTML = "";
  $("#lockPw").value = ""; $("#lockErr").textContent = "";
  $("#lock").hidden = false;
}
$("#lockForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const btn = $("#lockBtn"), pw = $("#lockPw").value.trim().toLowerCase();
  if (!pw) return;
  btn.disabled = true; btn.textContent = "جارٍ التحقق…";
  let ok = false;
  try { ok = (await derive(pw)) === LOCK_HASH; } catch {}
  btn.disabled = false; btn.textContent = "دخول";
  if (ok){ try { localStorage.setItem(UNLOCK_KEY, LOCK_HASH); } catch {} startApp(); }
  else {
    $("#lockErr").textContent = "كلمة المرور غير صحيحة.";
    const l = $("#lock"); l.classList.remove("shake"); void l.offsetWidth; l.classList.add("shake");
    $("#lockPw").select();
  }
});

/* ---------- boot ---------- */
if (unlocked()) startApp();
else $("#lockPw").focus();
</script>
</body>
